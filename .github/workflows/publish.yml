name: Publish to npm

# Trigger on any tag that starts with "v" (e.g. v1.0.1)
on:
  push:
    tags:
      - 'v*'

jobs:
  npm-publish:
    runs-on: ubuntu-latest
    # OIDC trusted‑publisher policy gives this job a short‑lived npm token.
    permissions:
      contents: read
      id-token: write      # required for OIDC token exchange
      packages: write      # required for npm publish

    # Use the environment we created in the repository settings (`npm`).
    environment: npm

    steps:
      # -----------------------------------------------------------------
      # 0️⃣ Cache node_modules (speeds up repeated runs)
      # -----------------------------------------------------------------
      - name: Cache node modules
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # -----------------------------------------------------------------
      # 1️⃣ Checkout the exact commit (full history needed for tag verification)
      # -----------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # -----------------------------------------------------------------
      # 2️⃣ Set up Node (registry-url tells npm to use npmjs.org)
      # -----------------------------------------------------------------
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # -----------------------------------------------------------------
      # 3️⃣ Install dependencies (clean install) and build the package
      # -----------------------------------------------------------------
      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Build package
        run: npm run build

      # -----------------------------------------------------------------
      # 4️⃣ Verify the tag version matches the version declared in package.json
      # -----------------------------------------------------------------
      - name: Verify tag matches package version
        env:
          GIT_TAG: ${{ github.ref_name }}
        run: |
          TAG_VERSION="${GIT_TAG#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "❌ Tag $GIT_TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "✅ Tag matches package version $PKG_VERSION"

      # -----------------------------------------------------------------
      # 5️⃣ Publish to npm using OIDC auth (npm v10+ supports this natively
      #    when the trusted publisher policy is configured)
      # -----------------------------------------------------------------
      - name: Publish to npm
        run: npm publish --auth-type=oidc --access public
