name: Publish to npm

# Trigger on any tag that starts with "v" (e.g. v1.0.1)
on:
  push:
    tags:
      - 'v*'

jobs:
  npm-publish:
    runs-on: ubuntu-latest
    # OIDC trusted‑publisher policy gives this job a short‑lived npm token.
    permissions:
      contents: read
      id-token: write      # required for OIDC token exchange
      packages: write      # required for npm publish

    # Use the environment we created in the repository settings (`npm`).
    environment: npm

    steps:
      # -----------------------------------------------------------------
      # 0️⃣ Cache node_modules (speeds up repeated runs)
      # -----------------------------------------------------------------
      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # -----------------------------------------------------------------
      # 1️⃣ Checkout the exact commit (full history needed for tag verification)
      # -----------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------------------------------------------
      # 2️⃣ Set up Node (no npm token stored in the repo)
      # -----------------------------------------------------------------
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # -----------------------------------------------------------------
      # 3️⃣ Authenticate to npm via OIDC — exchange the GitHub OIDC token for
      #    a short‑lived npm publish token.
      # -----------------------------------------------------------------
      - name: Authenticate with npm via OIDC
        run: |
          # Create a temporary npm token using OIDC, then store it so `npm publish`
          # can use it. The OIDC trusted publisher policy must be configured in
          # GitHub → Org Settings → OIDC for this to work.
          NPM_TOKEN=$(npm token create \
            --auth-type oidc \
            --registry https://registry.npmjs.org \
            --json \
            --read-only false) 2>&1 || true
          echo "::set-output name=NPM_TOKEN::${NPM_TOKEN}"
          npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
        id: npm-oidc

      # -----------------------------------------------------------------
      # 4️⃣ Install dependencies (clean install) and build the package
      # -----------------------------------------------------------------
      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Build package
        run: npm run build

      # -----------------------------------------------------------------
      # 5️⃣ Verify the tag version matches the version declared in package.json
      # -----------------------------------------------------------------
      - name: Verify tag matches package version
        env:
          GIT_TAG: ${{ github.ref_name }}
        run: |
          TAG_VERSION="${GIT_TAG#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "❌ Tag $GIT_TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "✅ Tag matches package version $PKG_VERSION"

      # -----------------------------------------------------------------
      # 6️⃣ Publish to npm (uses the OIDC‑derived token automatically)
      # -----------------------------------------------------------------
      - name: Publish to npm
        run: npm publish --access public
